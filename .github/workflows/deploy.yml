name: Deploy .NET API to AWS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t inventory-api ./InventoryManagement

      - name: Tag Docker image for ECR
        run: |
          docker tag inventory-api ${{ secrets.ECR_IMAGE_URI }}

      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.ECR_IMAGE_URI }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          cluster: inventory-cluster
          service: inventory-api-service
          task-definition: ecs-task-def.json
          container-name: inventory-api
          image: ${{ secrets.ECR_IMAGE_URI }}
          execution-role-arn: ${{ secrets.ECS_EXEC_ROLE_ARN }}
